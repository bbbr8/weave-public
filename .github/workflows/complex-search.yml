name: Complex evidence search evaluation
on:
  push:
    branches: [codex/complex-evidence-search-20261104]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          path: review
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: bbbr8/tally-public
          ref: 449a58aba07a3a2d7e6a4d26219689c6c8dc2e32
          path: tally
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify search and provenance mechanics
        run: python -m unittest discover -s review/independent_tests -p test_evidence_search.py -v
      - name: Freeze and run larger corpus and complex evaluations
        run: python review/independent_tests/complex_search_eval.py --tally tally --out complex-results
      - name: Retain ready search index and every evaluation outcome
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: complex-search-index-and-results
          path: |
            complex-results/*.json
            complex-results/evidence.sqlite
